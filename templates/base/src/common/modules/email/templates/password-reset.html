<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password Reset</title>
</head>
<body style="margin: 0; padding: 24px; background-color: #f4f4f5; font-family: Arial, Helvetica, sans-serif; color: #18181b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; border: 1px solid #e4e4e7;">
        <tr>
            <td style="padding: 24px 32px; background-color: #18181b; text-align: center;">
                <h1 style="margin: 0; color: #ffffff; font-size: 20px;">Reset your password</h1>
            </td>
        </tr>
        <tr>
            <td style="padding: 32px;">
                <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.6;">We received a request to reset your password. Use the token below to set a new one:</p>
                <p style="margin: 0 0 16px; font-size: 20px; font-weight: bold; text-align: center; color: #18181b;">{{token}}</p>
                <p style="margin: 0; font-size: 13px; color: #71717a;">This token will expire in 10 minutes. If you didn't request it, you can ignore this email.</p>
            </td>
        </tr>
    </table>
</body>
</html>
